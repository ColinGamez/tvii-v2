worker_processes 1;
error_log /var/log/nginx/error.log debug;

events {
    worker_connections 1024;
}

http {
    # TLS termination proxy for Wii U NSSL compatibility
    server {
        listen 4443 ssl;

        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        # Maximum TLS compatibility for Wii U's NSSL library
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers 'ALL:!aNULL:!eNULL:!EXPORT:@STRENGTH';
        ssl_prefer_server_ciphers off;

        # Proxy all requests to the Bun HTTP server
        location / {
            proxy_pass http://host.docker.internal:10060;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Pass through all original headers (including X-Nintendo-ServiceToken)
            proxy_pass_request_headers on;
        }
    }
}
