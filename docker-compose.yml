services:
  mysql:
    image: mysql:8.0
    container_name: tvii-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
    ports:
      - "3306:3306"
    volumes:
      - tvii-mysql-data:/var/lib/mysql
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./scripts/whitelist.sql:/docker-entrypoint-initdb.d/02-whitelist.sql

  redis:
    image: redis:7-alpine
    container_name: tvii-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    volumes:
      - tvii-redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: tvii-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tvii-minio-data:/data

volumes:
  tvii-mysql-data:
  tvii-redis-data:
  tvii-minio-data:
